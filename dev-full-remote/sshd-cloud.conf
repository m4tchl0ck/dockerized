# The complete sshd policy for a container reachable from the internet.
#
# Installed as /etc/ssh/sshd_config.d/10-cloud.conf, and the only drop-in in
# the image — this image installs the SSH server itself, so there is no
# inherited configuration to merge with. The effective policy can be read here
# in full.
#
# Keep it that way. sshd takes the FIRST value it sees for most keywords and
# reads sshd_config.d in lexical order, so a second drop-in would resolve
# against this one by filename, and a directive that one file quietly relies on
# from another is invisible until someone changes it.
#
# Hence the four basics below: without them Debian's own sshd_config defaults
# apply, and those permit password and keyboard-interactive authentication.

Port 22
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no

# Keys come only from /etc/ssh/authorized_keys.d/<user>, which is root owned
# and written by the entrypoint from AUTHORIZED_KEYS. Dropping
# .ssh/authorized_keys means a logged-in user cannot authorise further keys
# for themselves, so deployment config stays the only source of truth.
AuthorizedKeysFile /etc/ssh/authorized_keys.d/%u

# root has no directly authenticatable path.
PermitRootLogin no
AllowUsers app

# Public key is the only accepted method, which forecloses any PAM-based path
# a later package might enable.
AuthenticationMethods publickey

# Each offered key counts as an attempt, so clients with several loaded keys
# should set IdentitiesOnly=yes and name the key explicitly.
MaxAuthTries 3
LoginGraceTime 30
MaxStartups 10:30:30

# Drop dead sessions rather than leaving them pinned open on a public address.
# A laptop that sleeps mid-session is the common case.
ClientAliveInterval 60
ClientAliveCountMax 3

# Log the fingerprint of the key that authenticated, not just that someone did.
LogLevel VERBOSE

# Forwarding is off. On Azure, an SSH tunnel to the instance metadata service
# at 169.254.169.254 would hand out managed identity tokens, and the container
# would otherwise work as a pivot into any network it can reach.
AllowTcpForwarding no
AllowAgentForwarding no
X11Forwarding no
PermitTunnel no
GatewayPorts no
